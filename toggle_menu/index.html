<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <title>Barbearia PH Sallon</title>
</head>

<body>
    <!-- Para fins de estilização -->
    <div class="background">
        <div class="background-overlay"></div>
    </div>

    <!-- Toggle-menu -->
    <div class="toggle-menu">
        <!-- Checkbox :checked = open;
        :unchecked = closed; -->

        <!-- state switcher -->
        <input type="checkbox" id="state-switcher">

        <!-- menu-trigger -->
        <label for="state-switcher" class="checkbox-trigger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </label>

        <!-- Hidden menu/nav links-->
        <div class="overlay-nav-links">
            <nav class="nav-links">
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Galeria</a></li>
                    <li><a href="#">Equipe</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Content after the menu (Hero section) -->
    <div class="content">
        <h1>Rondônia</h1>
        <p>Governo do estado</p>
        <p>Governo federal</p>
        <button class="know-more">Saiba mais</button>
    </div>
</body>

</html>
