<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Barbearia PH Sallon</title>
</head>

<body>
    <header>
        <!-- Header logo -->
        <div class="header_logo">
            <a href="#">
                <img class="logo-ph-sallon" src="./assets/images/header_and_hero/logo_ph_salon.svg"
                    alt="PHSALLON BARBEARIA, página inicial">

                <img class="logo-nome-ph-sallon" src="./assets/images/header_and_hero/logo-nome-ph-sallon_2.svg" alt="">
            </a>
        </div>

        <!-- Toggle menu -->
        <div class="toggle-menu-container">

            <!-- state switcher -->
            <input type="checkbox" id="state-switcher">

            <!-- menu-trigger -->
            <label for="state-switcher" class="state-switcher-trigger">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </label>

            <!-- Nav links-->
            <div class="nav-links-container">
                <nav class="nav-links">
                    <ul>
                        <li><a href="#">Início</a></li>
                        <li><a href="#">Galeria</a></li>
                        <li><a href="#">Feedback</a></li>
                        <li><a href="#">Serviços</a></li>
                        <li><a href="#">Informações</a></li>
                        <li><a href="#">FAQ</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="header-background"></div>

    <main>
        <section class="hero_section">
            <div class="background"></div>
            <h1 class="head-line">Visual<br> alinhado e<br> confiança renovada<br> em uma<br> única visita</h1>

            <div class="hero_image_container">
                <img class="hero_image" src="./assets/images/header_and_hero/hero_image_mobile.avif" alt="Hero image">
            </div>
        </section>
    </main>
</body>

</html>
