<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Barbearia PH Sallon</title>
</head>

<body>
    <header>
        <!-- Header logo -->
        <div class="header_logo">
            <a href="#">
                <img class="logo-ph-sallon" src="./assets/images/header_and_hero/logo_ph_salon.svg" alt="PHSALLON BARBEARIA, página inicial">

                <img class="logo-nome-ph-sallon" src="./assets/images/header_and_hero/logo-nome-ph-sallon_2.svg" alt="">
            </a>
        </div>

        <!-- Toggle menu -->
        <div class="toggle-menu-container">

            <!-- state switcher -->
            <input type="checkbox" id="state-switcher">

            <!-- menu-trigger -->
            <label for="state-switcher" class="state-switcher-trigger">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </label>

            <!-- nav links-->
            <div class="nav-links-container">
                <nav class="nav-links">
                    <ul>
                        <li><a href="#hero_section">Início</a></li>
                        <li><a href="#">Galeria</a></li>
                        <li><a href="#">Feedback</a></li>
                        <li><a href="#">Serviços</a></li>
                        <li><a href="#">Informações</a></li>
                        <li><a href="#">FAQ</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="header-background"></div>

    <main>
        <!-- Hero section -->
        <section id="hero_section">
            <!-- Headline -->
            <h1 class="head-line">
                Visual<br> alinhado e<br> <span class="golden-text">confiança renovada</span><br> em uma<br> única
                visita
            </h1>

            <!-- Subheadline -->
            <p class="sub-head-line">
                Especialista em cortes e<br> barba em Porto Velho.<br> Barbeiro profissional<br> desde 2017.
            </p>

            <!-- Hero cta link -->
            <a class="hero-cta-link"  href="https://chat.inbarberapp.com/AgendarcomPH" target="_blank">Agendar meu horário</a>
        </section>
    </main>
</body>

</html>
