<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <title>Barbearia PH Sallon</title>
</head>

<body>
    <!-- Para fins de estilização -->
    <div class="background">
        <div class="background-overlay"></div>
    </div>

    <!-- Toggle-menu -->
    <div class="toggle-menu">
        <!-- Checkbox :checked = open;
        :unchecked = closed; -->

        <!-- state switcher -->
        <input type="checkbox" id="toggle-menu">

        <!-- menu-icon/trigger -->
        <label for="toggle-menu" class="menu-icon">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </label>

        <!-- Hidden menu/nav links-->
        <div class="overlay">
            <ul>
                <li href="#">Início</li>
                <li href="#">Galeria</li>
                <li href="#">Equipe</li>
                <li href="#">Contato</li>
            </ul>
        </div>

        <!-- Content after the menu (Hero sevtion) -->
        <div class="content">
            <h1>Descubra nossa arte</h1>
            <p>Exploque a arte e a beleza que a nossa galeria tem a oferecer.</p>
        </div>
    </div>
</body>

</html>
